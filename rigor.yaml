# aegis-lite Rigor Mode Configuration
# Controls scope of features per mode: demo | standard | enterprise

rigor:
  mode: "demo"  # default: demo | standard | enterprise

  # DEMO MODE - Minimal scope for quick demos
  demo:
    agent_registry:
      max_agents: 3
      persistence: "memory"
      health_check_interval_sec: 30
    confidence_gate:
      min_confidence: 0.7
      fallback: "human_review"
      thresholds:
        low: 0.5
        medium: 0.7
        high: 0.9
    reasoning_trace:
      enabled: true
      max_depth: 3
      storage: "memory"
      export_formats: ["json"]
    stress_test:
      enabled: true
      max_concurrent: 10
      duration_sec: 30
      scenarios: ["load", "latency"]
    cli_skills:
      enabled: true
      commands: ["register", "invoke", "trace", "health"]
      autocomplete: false
    safety_guardrails:
      enabled: true
      rules: ["pii_detection", "toxicity"]
      action: "log"

  # STANDARD MODE - Production-ready with more features
  standard:
    agent_registry:
      max_agents: 10
      persistence: "sqlite"
      health_check_interval_sec: 15
    confidence_gate:
      min_confidence: 0.75
      fallback: "escalate"
      thresholds:
        low: 0.6
        medium: 0.75
        high: 0.9
      calibration_enabled: true
    reasoning_trace:
      enabled: true
      max_depth: 10
      storage: "sqlite"
      export_formats: ["json", "mermaid", "opentelemetry"]
      sampling_rate: 0.5
    stress_test:
      enabled: true
      max_concurrent: 100
      duration_sec: 300
      scenarios: ["load", "latency", "fault_injection", "chaos"]
      ramp_up_sec: 30
    cli_skills:
      enabled: true
      commands: ["register", "invoke", "trace", "health", "benchmark", "migrate"]
      autocomplete: true
      plugin_support: true
    safety_guardrails:
      enabled: true
      rules: ["pii_detection", "toxicity", "prompt_injection", "hallucination"]
      action: "block"
      custom_rules: true

  # ENTERPRISE MODE - Full features with compliance
  enterprise:
    agent_registry:
      max_agents: 100
      persistence: "postgresql"
      health_check_interval_sec: 5
      replication: true
      audit_log: true
    confidence_gate:
      min_confidence: 0.8
      fallback: "deterministic_guardrail"
      thresholds:
        low: 0.65
        medium: 0.8
        high: 0.95
      calibration_enabled: true
      adaptive_thresholds: true
      audit_trail: true
    reasoning_trace:
      enabled: true
      max_depth: 50
      storage: "postgresql"
      export_formats: ["json", "mermaid", "opentelemetry", "jaeger"]
      sampling_rate: 1.0
      compression: true
      retention_days: 90
      pii_redaction: true
    stress_test:
      enabled: true
      max_concurrent: 1000
      duration_sec: 3600
      scenarios: ["load", "latency", "fault_injection", "chaos", "soak", "spike"]
      ramp_up_sec: 60
      distributed: true
      sla_thresholds:
        p99_latency_ms: 500
        error_rate: 0.001
        throughput_rps: 1000
    cli_skills:
      enabled: true
      commands: ["register", "invoke", "trace", "health", "benchmark", "migrate", "audit", "policy"]
      autocomplete: true
      plugin_support: true
      rbac: true
      telemetry: true
    safety_guardrails:
      enabled: true
      rules: ["pii_detection", "toxicity", "prompt_injection", "hallucination", "bias", "copyright"]
      action: "block_and_alert"
      custom_rules: true
      real_time: true
      compliance_frameworks: ["GDPR", "HIPAA", "SOC2"]
      audit_log: true